# OpenAPI 3.1; JSON syntax is valid YAML 1.2.
{
  "openapi": "3.1.0",
  "info": {
    "title": "Matriz task API",
    "version": "0.1.0",
    "description": "Design contract only. Two operations from the approved MVP. Technology-neutral; no implementation or deployed server. Session cookie name and CSRF header are proposed technical conventions."
  },
  "security": [
    {
      "sessionCookie": []
    }
  ],
  "paths": {
    "/projects/{projectId}/tasks": {
      "parameters": [
        {
          "name": "projectId",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "minLength": 1
          },
          "description": "Opaque project identifier."
        }
      ],
      "post": {
        "operationId": "createProjectTask",
        "summary": "Create a task in an accessible project",
        "description": "Any authenticated project member may create a task. Trim title and description, reject blank values, and validate limits after trimming. New tasks are todo and unassigned. Verify project access before returning field errors. A confirmed transaction precedes 201. Idempotency and uncertain network retry behavior remain unresolved.",
        "parameters": [
          {
            "name": "X-CSRF-Token",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1
            },
            "description": "Token bound to the server session; delivery mechanism pending."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateTask"
              },
              "example": {
                "title": "Review project scope",
                "description": "Review the approved MVP and record remaining questions."
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Task created and persisted; initial status todo and assigneeId null.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Task"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input or query parameters.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Missing, expired, or invalid session.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Project not found or inaccessible; identical generic response.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "Unexpected error; no internal details exposed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Missing or invalid CSRF token.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      },
      "get": {
        "operationId": "listProjectTasks",
        "summary": "List tasks in an accessible project",
        "description": "Any authenticated project member may list tasks. Draft ordering: ascending opaque ID, compared consistently by the implementation. Total counts all project tasks, not just this page. Offset pagination is not a stable snapshot under concurrent changes.",
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "name": "offset",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 0,
              "default": 0
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Task page; items may be empty. Offset beyond the end returns an empty page with the actual total.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TaskPage"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input or query parameters.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Missing, expired, or invalid session.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Project not found or inaccessible; identical generic response.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "description": "Unexpected error; no internal details exposed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "sessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "matriz_session",
        "description": "Server-managed session; proposed cookie flags Secure, HttpOnly, SameSite=Lax, Path=/. No Domain attribute. HTTPS required. Login/logout and expiry policies are outside this two-operation contract."
      }
    },
    "schemas": {
      "CreateTask": {
        "type": "object",
        "required": [
          "title",
          "description"
        ],
        "additionalProperties": false,
        "properties": {
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120,
            "pattern": "\\S",
            "description": "Trim leading/trailing whitespace before validating and saving."
          },
          "description": {
            "type": "string",
            "minLength": 1,
            "maxLength": 2000,
            "pattern": "\\S",
            "description": "Mandatory; trim leading/trailing whitespace before validating and saving."
          }
        }
      },
      "Task": {
        "type": "object",
        "required": [
          "id",
          "projectId",
          "title",
          "description",
          "status",
          "assigneeId"
        ],
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "minLength": 1
          },
          "projectId": {
            "type": "string",
            "minLength": 1
          },
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "description": {
            "type": "string",
            "minLength": 1,
            "maxLength": 2000
          },
          "status": {
            "type": "string",
            "enum": [
              "todo",
              "in_progress",
              "done"
            ]
          },
          "assigneeId": {
            "type": [
              "string",
              "null"
            ],
            "minLength": 1
          }
        }
      },
      "TaskPage": {
        "type": "object",
        "required": [
          "items",
          "total",
          "limit",
          "offset"
        ],
        "additionalProperties": false,
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Task"
            }
          },
          "total": {
            "type": "integer",
            "minimum": 0
          },
          "limit": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100
          },
          "offset": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "Error": {
        "type": "object",
        "required": [
          "code",
          "message"
        ],
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "fields": {
            "type": "object",
            "additionalProperties": {
              "type": "string"
            }
          }
        },
        "additionalProperties": false
      }
    }
  }
}
