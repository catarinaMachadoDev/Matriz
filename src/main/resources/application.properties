spring.application.name=matriz
spring.config.import=optional:file:./.local/application.properties
spring.datasource.url=${MATRIZ_DB_URL:jdbc:postgresql://localhost:5432/matriz}
spring.datasource.username=${MATRIZ_DB_USER:matriz}
spring.datasource.password=${MATRIZ_DB_PASSWORD:}
spring.flyway.enabled=true
server.address=${MATRIZ_BIND_ADDRESS:127.0.0.1}
server.port=${MATRIZ_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=matriz_session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${MATRIZ_SECURE_COOKIE:true}
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
matriz.demo.enabled=${MATRIZ_DEMO_ENABLED:false}
