name: Matriz CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    # Playwright 1.55 cannot install Chromium on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: matriz_test
          POSTGRES_USER: matriz
          POSTGRES_PASSWORD: ci-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matriz -d matriz_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MATRIZ_DB_USER: matriz
      MATRIZ_DB_PASSWORD: ci-fixture-only
      MATRIZ_E2E: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install Chromium for Playwright
        run: sh ./mvnw -B test-compile org.codehaus.mojo:exec-maven-plugin:3.5.0:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.classpathScope=test "-Dexec.args=install --with-deps chromium"
      - name: Test and package
        run: sh ./mvnw -B verify
      - name: Build application image
        run: docker build -t matriz:ci .
